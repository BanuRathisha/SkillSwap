
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap - Student Skill Exchange System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Content -->
    <main class="container">

        <section class="brand-section">
            <h1>SkillSwap</h1>
            <p>Student Skill Exchange System</p>
        </section>

        <!-- Login Form -->
        <section class="form-box" id="loginSection">
            <h2>Student Login</h2>

            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <p id="loginMessage" class="message"></p>

            <p class="switch-text">
                Don't have an account?
                <button
                    type="button"
                    class="text-button"
                    onclick="showRegister()"
                >Register</button>
            </p>
        </section>

        <!-- Registration Form -->
        <section class="form-box" id="registerSection" style="display: none;">
            <h2>Student Registration</h2>

            <form id="registerForm">
                <label for="registerName">Name</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >

                <label for="registerEmail">Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="registerPassword">Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

                <label for="registerDepartment">Department</label>
                <input
                    type="text"
                    id="registerDepartment"
                    placeholder="Example: IT"
                >

                <label for="registerYear">Year</label>
                <select id="registerYear">
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>

                <button type="submit">Register</button>
            </form>

            <p id="registerMessage" class="message"></p>

            <p class="switch-text">
                Already have an account?
                <button
                    type="button"
                    class="text-button"
                    onclick="showLogin()"
                >Login</button>
            </p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
